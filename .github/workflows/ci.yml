name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restores for linux-x64 explicitly. Google.OrTools depends on all five
      # runtime packages unconditionally, and pinning the RID is what keeps the
      # published output (and later the image) from carrying four unused copies
      # of the native solver.
      - name: Restore
        run: dotnet restore ShiftReason.slnx -r linux-x64

      - name: Build
        run: dotnet build ShiftReason.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ShiftReason.slnx -c Release --no-build --logger "console;verbosity=normal"

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ShiftReason.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/ShiftReason.Web/package-lock.json

      - run: npm ci

      # Replays the committed demo traces through the real reducer. This is what
      # catches the published demo drifting from what the solver actually does.
      - run: npm test

      - run: npm run build

  # The dev machine has no WSL, so Linux containers cannot run there. This job is
  # the only place the glibc / RID / native-load path is proven before deploy.
  container-check:
    name: OR-Tools native runtime on 10.0-noble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build spike image
        run: docker build -f spike/Dockerfile -t shiftreason-spike .

      - name: Run solver checks inside the container
        run: docker run --rm --cpus=4 shiftreason-spike

      - name: Report published image size
        run: |
          echo "### Spike image size" >> "$GITHUB_STEP_SUMMARY"
          docker images shiftreason-spike --format '{{.Size}}' >> "$GITHUB_STEP_SUMMARY"
